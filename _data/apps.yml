# Web apps shown on /apps/ (_pages/apps.md).
# To add an app: append an item under the right group. Image: 640x400 JPG in /images/apps/.

- group: "Research & Writing"
  icon: "fas fa-pen-nib"
  apps:
    - name: "The Paper Formula Book"
      url: "https://paperformula.vercel.app/"
      image: "/images/apps/paperformula.jpg"
      description: "An interactive guide to writing every section of a research paper: memorize rhetorical moves, not paragraphs."
      tags: ["Academic Writing", "Guide"]

